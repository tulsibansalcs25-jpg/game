<!DOCTYPE html>
<html>


<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color:lightcoral
        }

        button {
            width: 60px;
            height: 60px;
            font-size: 25px;
            margin: 5px;
            cursor: pointer;
        }

        h1 {
            color: blue;
        }
    </style>

</head>


<body>

    <h1>Tic Tac Toe Game</h1>

    <h2 id="msg">Player X Turn</h2>

    <button onclick="play(0)" id="b0"></button>
    <button onclick="play(1)" id="b1"></button>
    <button onclick="play(2)" id="b2"></button>
    <br><br>

    <button onclick="play(3)" id="b3"></button>
    <button onclick="play(4)" id="b4"></button>
    <button onclick="play(5)" id="b5"></button>
    <br><br>

    <button onclick="play(6)" id="b6"></button>
    <button onclick="play(7)" id="b7"></button>
    <button onclick="play(8)" id="b8"></button>

    <br><br>

    <button onclick="reset()">Reset</button>

    <script>

        let player = "X";
        let count = 0;

        function play(n) {

            let box = document.getElementById("b" + n);

            if (box.innerHTML == "") {

                box.innerHTML = player;
                count++;

                if (check()) {
                    document.getElementById("msg").innerHTML =
                    player + " Wins!";
                    return;
                }

                if (count == 9) {
                    document.getElementById("msg").innerHTML = "Draw!";
                    return;
                }

                if (player == "X") {
                    player = "O";
                } else {
                    player = "X";
                }

                document.getElementById("msg").innerHTML =
                "Player " + player + " Turn";
            }
        }

        function check() {

            let a = document.getElementById("b0").innerHTML;
            let b = document.getElementById("b1").innerHTML;
            let c = document.getElementById("b2").innerHTML;

            if (a != "" && a == b && b == c)
                return true;

            return false;
        }

        function reset() {

            for (let i = 0; i < 9; i++) {
                document.getElementById("b" + i).innerHTML = "";
            }

            player = "X";
            count = 0;

            document.getElementById("msg").innerHTML =
            "Player X Turn";
        }

    </script>

</body>
</html>
